# CI for the native Windows app under dotnet/ (see docs/native/PLAN.md).
#
# Runs only when the native tree, the shared contract, .gitattributes (which pins the
# contract and the generated tables to LF) or this file changes, so Electron-only PRs stay
# on ci.yml alone. Two jobs:
#
# - Linux builds the WHOLE solution (EnableWindowsTargeting lets WPF and CsWin32
#   compile there) and runs the platform-neutral ShotAI.Core tests, which include the
#   shared contract/conformance suite. Cheap, and it is what cloud sessions can run.
# - Windows builds and runs every test project, including the ones that need Windows.
#
# Path-filtered jobs never report on PRs they skip, so do not make them required
# status checks without a paths-filter step, or those PRs will wait forever.
name: native (.NET)

on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'contract/**'
      - '.gitattributes'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'contract/**'
      - '.gitattributes'
      - '.github/workflows/dotnet.yml'

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

# dotnet finds global.json by searching up from the working directory, and global.json
# is what opts `dotnet test` into Microsoft.Testing.Platform (required by xunit.v3 on
# the .NET 10 SDK). Run every step from dotnet/ or that opt-in is silently missed.
defaults:
  run:
    working-directory: dotnet

jobs:
  linux:
    name: build all · test core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Locked restore: the committed packages.lock.json files, nuget.org only, repository
      # signatures required (dotnet/nuget.config). CI=true also sets RestoreLockedMode.
      - name: Restore (locked)
        run: dotnet restore ShotAI.slnx --locked-mode
      # The C# brand table is generated from contract/brand.json, which is byte-identical to
      # the copy in Armadillon44/shotAI_MacOS; this fails when the checked-in table no longer
      # matches the contract (docs/native/spec/10-brand-settings-infra.md 7.3).
      - name: Brand table is current
        run: dotnet run --project tools/ShotAI.GenBrand -c Release --no-restore -- --check
      - name: Build
        run: dotnet build ShotAI.slnx -c Release --no-restore
      - name: Test (core)
        run: dotnet test --project tests/ShotAI.Core.Tests/ShotAI.Core.Tests.csproj -c Release --no-build
      # The conformance harness reports each OPEN case (a known divergence) in the test's
      # output and passes it. Microsoft.Testing.Platform prints a passing test's output only
      # with --output Detailed, so this re-runs that one class to put the report in the log
      # (docs/native/spec/01-model-store.md 7.11).
      - name: Conformance report (open cases)
        run: dotnet test --project tests/ShotAI.Core.Tests/ShotAI.Core.Tests.csproj -c Release --no-build --output Detailed --filter-class ShotAI.Core.Tests.Conformance.ConformanceTests

  windows:
    name: build + test (Windows)
    runs-on: windows-latest
    steps:
      # A default Windows clone converts text files to CRLF. The brand check must pass on
      # one (AC-INFRA-1), so this job pins that setting rather than inheriting it.
      - name: Check out with CRLF conversion
        working-directory: .
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore (locked)
        run: dotnet restore ShotAI.slnx --locked-mode
      - name: Brand table is current (CRLF checkout)
        run: dotnet run --project tools/ShotAI.GenBrand -c Release --no-restore -- --check
      - name: Build
        run: dotnet build ShotAI.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution ShotAI.slnx -c Release --no-build
